<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CauA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink:      #060505;
      --paper:    #ede8dc;
      --accent:   #8c1919;
      --gold:     #c9aa6f;
      --gold2:    #a07c3a;
      --muted:    #635d55;
      --border:   rgba(201,170,111,0.32);
      --border-h: rgba(201,170,111,0.75);
    }

    html { scroll-behavior: smooth; }

    body {
      min-height: 100vh;
      background: var(--ink);
      color: var(--paper);
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow-x: hidden;
    }

    /* ── Custom cursor ───────────────────────────── */
    * { cursor: none !important; }
    #cursor {
      position: fixed;
      width: 6px; height: 6px;
      background: var(--gold);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s, background 0.2s;
      mix-blend-mode: screen;
    }
    #cursor-ring {
      position: fixed;
      width: 28px; height: 28px;
      border: 1px solid rgba(201,170,111,0.5);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width 0.35s cubic-bezier(0.22,1,0.36,1),
                  height 0.35s cubic-bezier(0.22,1,0.36,1),
                  border-color 0.3s;
    }
    body.hovering #cursor       { width: 10px; height: 10px; background: var(--paper); }
    body.hovering #cursor-ring  { width: 44px; height: 44px; border-color: rgba(201,170,111,0.9); }

    /* ── Atmosphere ──────────────────────────────── */
    .grain {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.72' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.048;
    }
    .vignette {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: radial-gradient(ellipse 75% 65% at 50% 50%,
        transparent 25%, rgba(0,0,0,0.80) 100%);
    }
    .ruled {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background-image: repeating-linear-gradient(
        0deg,
        transparent 0px, transparent 39px,
        rgba(237,232,220,0.022) 39px, rgba(237,232,220,0.022) 40px
      );
    }
    .halo {
      position: fixed;
      top: -160px; left: 50%;
      transform: translateX(-50%);
      width: 700px; height: 380px;
      background: radial-gradient(ellipse,
        rgba(140,25,25,0.22) 0%,
        rgba(140,25,25,0.06) 45%,
        transparent 70%);
      pointer-events: none; z-index: 1;
      animation: haloBreath 8s ease-in-out infinite;
    }
    .halo-b {
      position: fixed;
      bottom: -180px; left: 50%;
      transform: translateX(-50%);
      width: 500px; height: 300px;
      background: radial-gradient(ellipse,
        rgba(201,170,111,0.08) 0%, transparent 70%);
      pointer-events: none; z-index: 1;
    }

    @keyframes haloBreath {
      0%, 100% { opacity: 1;   transform: translateX(-50%) scale(1); }
      50%       { opacity: 0.7; transform: translateX(-50%) scale(1.08); }
    }

    /* ── Page frame border ───────────────────────── */
    .frame {
      position: fixed; inset: 14px;
      pointer-events: none; z-index: 3;
      border: 1px solid rgba(201,170,111,0.14);
      animation: fadeIn 0.8s ease 0.1s both;
      opacity: 0;
    }
    .frame::before {
      content: '';
      position: absolute; inset: 5px;
      border: 1px solid rgba(201,170,111,0.055);
    }

    /* ── Corners ─────────────────────────────────── */
    .corner {
      position: fixed; width: 80px; height: 80px;
      pointer-events: none; z-index: 4;
      opacity: 0; animation: fadeIn 0.8s ease 0.05s both;
    }
    .corner svg { width: 100%; height: 100%; }
    .corner.tl { top: 10px; left: 10px; }
    .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .corner.br { bottom: 10px; right: 10px; transform: scale(-1); }

    /* ── Side ornaments ──────────────────────────── */
    .side {
      position: fixed; top: 50%; transform: translateY(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      opacity: 0; pointer-events: none; z-index: 3;
      animation: fadeIn 0.8s ease 0.1s both;
    }
    .side.l { left: 26px; }
    .side.r { right: 26px; }
    .side .vl {
      width: 1px; height: 100px;
      background: linear-gradient(to bottom, transparent, rgba(201,170,111,0.28), transparent);
    }
    .side .ss {
      writing-mode: vertical-rl;
      font-family: 'IM Fell English', serif;
      font-style: italic; font-size: 11px;
      letter-spacing: 16px;
      color: rgba(201,170,111,0.32);
    }

    /* ── Page ────────────────────────────────────── */
    .page {
      position: relative; z-index: 2;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 80px 24px;
    }
    .container { width: 100%; max-width: 450px; text-align: center; }

    /* ── Header ──────────────────────────────────── */
    .header { margin-bottom: 58px; }

    .eyebrow {
      font-size: 9.5px; letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--gold); font-weight: 300;
      margin-bottom: 28px;
      opacity: 0; animation: fadeIn 1.4s ease 0.15s both;
    }

    .name-wrap {
      position: relative;
      display: inline-block;
      opacity: 0;
      animation: nameReveal 1.1s cubic-bezier(0.16,1,0.3,1) 0.05s both;
    }
    /* subtle horizontal rule through the name */
    .name-wrap::after {
      content: '';
      position: absolute;
      left: -6%; right: -6%;
      top: 50%; height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(201,170,111,0.12) 25%,
        rgba(201,170,111,0.12) 75%,
        transparent 100%);
      pointer-events: none;
    }

    .name {
      font-family: 'IM Fell English', Georgia, serif;
      font-size: clamp(78px, 18vw, 110px);
      font-weight: 400;
      line-height: 0.85;
      letter-spacing: -3px;
      display: block;
    }
    .n-reg {
      font-style: italic;
      color: var(--paper);
    }
    .n-cap {
      font-style: normal;
      color: var(--gold);
      font-size: 0.78em;
      vertical-align: baseline;
      position: relative; top: -0.05em;
      text-shadow:
        0 0 40px rgba(201,170,111,0.45),
        0 0 90px rgba(201,170,111,0.15);
    }

    /* Ornamental divider */
    .orn {
      display: flex; align-items: center; gap: 12px;
      margin: 28px auto 0; max-width: 200px;
      opacity: 0; animation: fadeIn 1.2s ease 0.5s both;
    }
    .ol {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, var(--gold2));
    }
    .ol.r { background: linear-gradient(to left, transparent, var(--gold2)); }
    .os {
      color: var(--accent); font-size: 13px; line-height: 1;
      text-shadow: 0 0 12px rgba(140,25,25,0.55);
    }

    /* ── Links ───────────────────────────────────── */
    .links { display: flex; flex-direction: column; gap: 12px; }

    .link-item {
      position: relative;
      opacity: 0;
      animation: revealUp 1s cubic-bezier(0.16,1,0.3,1) both;
    }
    .link-item:nth-child(1) { animation-delay: 0.50s; }
    .link-item:nth-child(2) { animation-delay: 0.65s; }
    .link-item:nth-child(3) { animation-delay: 0.80s; }

    .link-btn {
      display: flex; align-items: center;
      text-decoration: none; color: var(--paper);
      padding: 20px 26px;
      position: relative; overflow: hidden;
      /* Clipped corner — bottom-right notch */
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
      background: linear-gradient(135deg,
        rgba(201,170,111,0.07) 0%,
        rgba(201,170,111,0.02) 60%,
        rgba(237,232,220,0.01) 100%);
      transition: box-shadow 0.5s ease;
    }

    /* Outer gold border via box-shadow outline trick on wrapper */
    .link-item {
      position: relative;
    }
    .link-item::before {
      content: '';
      position: absolute; inset: 0;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
      background: transparent;
      border: 1px solid var(--border);
      z-index: 0;
      pointer-events: none;
      transition: border-color 0.4s;
    }
    .link-item:hover::before {
      border-color: var(--border-h);
    }

    /* Notch accent line — the diagonal cut edge */
    .link-btn .notch-line {
      position: absolute;
      bottom: 13px; right: -1px;
      width: 20px; height: 1px;
      background: var(--gold);
      transform: rotate(-45deg);
      transform-origin: right center;
      opacity: 0.55;
      z-index: 5;
      transition: opacity 0.4s, background 0.4s;
    }

    /* Left accent bar — always visible, gold */
    .link-btn .edge-glow {
      position: absolute;
      left: 0; top: 0; bottom: 0; width: 2px;
      background: linear-gradient(to bottom,
        transparent 0%,
        rgba(201,170,111,0.6) 30%,
        rgba(201,170,111,0.6) 70%,
        transparent 100%);
      opacity: 0.5; transition: opacity 0.4s, width 0.4s; z-index: 3;
    }

    /* Top shimmer sweep */
    .link-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -120%; width: 60%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      transition: left 0.55s ease; z-index: 3;
    }

    /* Fill sweep */
    .link-btn::after {
      content: '';
      position: absolute; inset: 0;
      background: var(--paper);
      transform: translateX(-101%);
      transition: transform 0.45s cubic-bezier(0.77,0,0.175,1); z-index: 0;
    }

    .link-btn:hover {
      box-shadow:
        0 0 0 1px rgba(201,170,111,0.2) inset,
        0 0 40px rgba(201,170,111,0.06);
    }
    .link-btn:hover::before { left: 120%; }
    .link-btn:hover::after  { transform: translateX(0); }
    .link-btn:hover .edge-glow { opacity: 1; width: 3px; background: linear-gradient(to bottom, transparent, var(--ink), transparent); }
    .link-btn:hover .notch-line { opacity: 0; }
    .link-btn:hover .num  { color: rgba(10,10,10,0.3); }
    .link-btn:hover .ico svg { fill: var(--ink); }
    .link-btn:hover .lbl  { color: var(--ink); }
    .link-btn:hover .sub  { color: rgba(10,10,10,0.45); }
    .link-btn:hover .arr  { opacity: 1; transform: translateX(0); color: var(--ink); }

    .num {
      font-size: 8.5px; letter-spacing: 2px;
      color: var(--accent); font-weight: 300;
      min-width: 24px; text-align: left;
      position: relative; z-index: 2;
      transition: color 0.4s;
      font-family: 'Cormorant Garamond', serif; font-style: italic;
    }
    .ico {
      width: 15px; height: 15px;
      margin: 0 18px 0 4px;
      position: relative; z-index: 2; flex-shrink: 0; opacity: 0.85;
    }
    .ico svg { width: 15px; height: 15px; fill: var(--paper); transition: fill 0.4s; }

    .lbl {
      flex: 1; text-align: left;
      font-size: 12.5px; letter-spacing: 4px;
      text-transform: uppercase; font-weight: 300;
      font-family: 'Cormorant Garamond', serif;
      position: relative; z-index: 2; transition: color 0.4s;
    }
    .sub {
      font-size: 10.5px; letter-spacing: 0.3px;
      color: var(--muted); font-style: italic;
      display: block; margin-top: 4px;
      font-weight: 300; position: relative; z-index: 2; transition: color 0.4s;
    }
    .arr {
      position: relative; z-index: 2;
      opacity: 0; transform: translateX(-12px);
      transition: opacity 0.35s, transform 0.35s; font-size: 14px;
    }

    /* ── Footer ──────────────────────────────────── */
    .footer {
      margin-top: 52px;
      opacity: 0; animation: fadeIn 1.5s ease 1.05s both;
    }
    .footer-orn {
      display: flex; align-items: center;
      justify-content: center; gap: 12px; margin-bottom: 16px;
    }
    .footer-orn::before, .footer-orn::after {
      content: '';
      width: 44px; height: 1px;
      background: linear-gradient(to right, transparent, rgba(201,170,111,0.2));
    }
    .footer-orn::after {
      background: linear-gradient(to left, transparent, rgba(201,170,111,0.2));
    }
    .f-cross {
      color: var(--accent); font-size: 10px; letter-spacing: 7px;
      opacity: 0.5; text-shadow: 0 0 8px rgba(140,25,25,0.5);
    }
    .footer-copy {
      font-size: 8.5px; letter-spacing: 5px;
      text-transform: uppercase; color: var(--muted); opacity: 0.3;
    }

    /* ── Keyframes ───────────────────────────────── */
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
    @keyframes nameReveal {
      from { opacity: 0; transform: translateY(-30px) scaleY(0.92); filter: blur(4px); }
      to   { opacity: 1; transform: translateY(0)     scaleY(1);    filter: blur(0); }
    }
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(32px); filter: blur(2px); }
      to   { opacity: 1; transform: translateY(0);    filter: blur(0); }
    }

    /* ── Mobile ──────────────────────────────────── */
    @media (max-width: 600px) {
      .side, #cursor, #cursor-ring { display: none; }
      * { cursor: auto !important; }
      .corner { width: 48px; height: 48px; }
      .frame { inset: 8px; }
      .page { padding: 60px 18px; }
      .header { margin-bottom: 44px; }
    }
  </style>
</head>

  <script>
    const cur  = document.getElementById('cursor');
    const ring = document.getElementById('cursor-ring');
    let mx = 0, my = 0, rx = 0, ry = 0;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cur.style.left = mx + 'px';
      cur.style.top  = my + 'px';
    });

    (function lerp() {
      rx += (mx - rx) * 0.13;
      ry += (my - ry) * 0.13;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(lerp);
    })();

    document.querySelectorAll('.link-btn').forEach(el => {
      el.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
      el.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
    });
  </script>
