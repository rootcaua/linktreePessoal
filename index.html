<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>caua fortes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --ink: #0a0a0a;
      --paper: #f5f0e8;
      --accent: #8b1a1a;
      --muted: #6b6258;
      --border: #2a2420;
    }

    html, body {
      min-height: 100vh;
      background: var(--ink);
      color: var(--paper);
      font-family: 'Cormorant Garamond', Georgia, serif;
      overflow-x: hidden;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 0;
    }

    /* Horizontal ruled lines background */
    .bg-lines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-lines::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 39px,
        rgba(245,240,232,0.04) 39px,
        rgba(245,240,232,0.04) 40px
      );
    }

    /* Side ornaments */
    .side-ornament {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      opacity: 0.18;
      pointer-events: none;
      z-index: 1;
    }
    .side-ornament.left { left: 24px; }
    .side-ornament.right { right: 24px; }
    .side-ornament .line {
      width: 1px;
      height: 80px;
      background: linear-gradient(to bottom, transparent, var(--paper), transparent);
    }
    .side-ornament .symbol {
      font-size: 18px;
      writing-mode: vertical-rl;
      letter-spacing: 12px;
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-weight: 300;
    }

    /* Corner marks */
    .corner {
      position: fixed;
      width: 40px;
      height: 40px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 1;
    }
    .corner svg { width: 100%; height: 100%; }
    .corner.tl { top: 20px; left: 20px; }
    .corner.tr { top: 20px; right: 20px; transform: scaleX(-1); }
    .corner.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
    .corner.br { bottom: 20px; right: 20px; transform: scale(-1); }

    /* Main layout */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    /* Header */
    .header {
      margin-bottom: 64px;
      animation: fadeDown 1s ease both;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 300;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeIn 1s ease 0.3s both;
    }

    .name {
      font-family: 'IM Fell English', Georgia, serif;
      font-size: clamp(52px, 12vw, 82px);
      font-weight: 400;
      line-height: 0.9;
      letter-spacing: -1px;
      color: var(--paper);
      position: relative;
    }

    .name .first {
      display: block;
      font-style: italic;
      opacity: 0;
      animation: fadeDown 0.9s ease 0.1s both;
    }
    .name .last {
      display: block;
      font-style: normal;
      font-size: 0.7em;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 8px;
      opacity: 0;
      animation: fadeDown 0.9s ease 0.25s both;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px auto 0;
      max-width: 200px;
      opacity: 0;
      animation: fadeIn 1s ease 0.5s both;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--muted));
    }
    .divider::after {
      background: linear-gradient(to left, transparent, var(--muted));
    }
    .divider-symbol {
      color: var(--accent);
      font-size: 14px;
    }

    /* Links */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .link-item {
      opacity: 0;
      animation: fadeUp 0.8s ease both;
    }
    .link-item:nth-child(1) { animation-delay: 0.5s; }
    .link-item:nth-child(2) { animation-delay: 0.65s; }
    .link-item:nth-child(3) { animation-delay: 0.8s; }

    .link-btn {
      display: flex;
      align-items: center;
      text-decoration: none;
      color: var(--paper);
      border: 1px solid rgba(245,240,232,0.15);
      padding: 20px 28px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.4s ease, color 0.4s ease;
      background: rgba(245,240,232,0.02);
      cursor: pointer;
    }

    .link-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--paper);
      transform: translateX(-101%);
      transition: transform 0.4s cubic-bezier(0.77, 0, 0.175, 1);
      z-index: 0;
    }

    .link-btn:hover::before {
      transform: translateX(0);
    }

    .link-btn:hover {
      color: var(--ink);
      border-color: var(--paper);
    }

    .link-btn:hover .link-icon svg { fill: var(--ink); }
    .link-btn:hover .link-number { color: var(--muted); }
    .link-btn:hover .link-arrow { opacity: 1; transform: translateX(0); }

    .link-number {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 400;
      min-width: 28px;
      text-align: left;
      position: relative;
      z-index: 1;
      transition: color 0.4s;
      font-family: 'Cormorant Garamond', serif;
    }

    .link-icon {
      width: 18px;
      height: 18px;
      margin-right: 18px;
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }
    .link-icon svg {
      width: 18px;
      height: 18px;
      fill: var(--paper);
      transition: fill 0.4s;
    }

    .link-label {
      flex: 1;
      text-align: left;
      font-size: 15px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 300;
      font-family: 'Cormorant Garamond', serif;
      position: relative;
      z-index: 1;
    }

    .link-sublabel {
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--muted);
      font-style: italic;
      display: block;
      margin-top: 3px;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      position: relative;
      z-index: 1;
      transition: color 0.4s;
    }
    .link-btn:hover .link-sublabel { color: rgba(10,10,10,0.5); }

    .link-arrow {
      position: relative;
      z-index: 1;
      opacity: 0;
      transform: translateX(-8px);
      transition: opacity 0.4s, transform 0.4s;
      font-size: 16px;
    }

    /* Footer */
    .footer {
      margin-top: 60px;
      opacity: 0;
      animation: fadeIn 1s ease 1s both;
    }

    .footer-line {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: center;
      margin-bottom: 16px;
    }
    .footer-line::before, .footer-line::after {
      content: '';
      width: 40px;
      height: 1px;
      background: rgba(245,240,232,0.12);
    }

    .footer-cross {
      color: var(--accent);
      font-size: 12px;
      letter-spacing: 6px;
      opacity: 0.5;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.4;
    }

    /* Keyframes */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Mobile */
    @media (max-width: 600px) {
      .side-ornament { display: none; }
      .corner { width: 28px; height: 28px; }
      .header { margin-bottom: 48px; }
    }
  </style>
</head>
